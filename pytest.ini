[pytest]
# Local developer hygiene: avoid collecting tests from OpenClaw PR worktrees
# (they often contain a second copy of this repo, which triggers ImportPathMismatchError).
norecursedirs =
    _pr_worktrees
    _worker_worktrees
    _workers
    _tmp
    tmp
    .git
    .venv
    venv
    node_modules

# Keep test output clean: Flask-Login currently emits a DeprecationWarning due to its
# internal use of datetime.utcnow(). This doesn't originate from our codebase.
filterwarnings =
    ignore:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning:flask_login\.login_manager
